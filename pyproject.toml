[project]
name = "tailtest-mcp"
version = "1.0.0-rc1"
description = "Tailtest for Cline. MCP server + .clinerules pack + Memory Bank integration. Adversarial test generation across 8+ Cline-supported editors."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AvanSaber Inc.", email = "support@avansaber.com" }]
requires-python = ">=3.10"
keywords = ["testing", "code-quality", "cline", "mcp", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp[server]>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
tailtest-mcp = "tailtest_mcp.server:main"

[project.urls]
Homepage = "https://tailtest.com"
Documentation = "https://tailtest.com/docs/cline"
Repository = "https://github.com/avansaber/tailtest-cline"
Issues = "https://github.com/avansaber/tailtest-cline/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
